[package]
name = "vslide"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VSlide desktop app"
publish = false
default-run = "vslide"

[lints]
workspace = true

[dependencies]
vslide-engine = { workspace = true }
vslide-ui-egui = { workspace = true }
vslide-media = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for vslide.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
image = { workspace = true }
cpal = "0.16"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
