[package]
name = "vslide-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VSlide PDF export (craft-pdf/Krilla): slides, notes pages and handouts with a selectable text layer, links and bookmarks"

[lints]
workspace = true

[dependencies]
vslide-model = { workspace = true }
vslide-fonts = { workspace = true }
vslide-text = { workspace = true }
vslide-render = { workspace = true }
craft-pdf = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
