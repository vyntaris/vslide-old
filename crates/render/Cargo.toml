[package]
name = "vslide-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VSlide renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
vslide-geom = { workspace = true }
vslide-color = { workspace = true }
vslide-model = { workspace = true }
vslide-fonts = { workspace = true }
vslide-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
