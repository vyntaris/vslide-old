[package]
name = "vslide-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VSlide engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
craft-mime = { workspace = true }
vslide-geom = { workspace = true }
vslide-color = { workspace = true }
vslide-model = { workspace = true }
vslide-fonts = { workspace = true }
vslide-text = { workspace = true }
vslide-render = { workspace = true }
vslide-pdf = { workspace = true }
vslide-format = { workspace = true }
vslide-pptx = { workspace = true }
vslide-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
vslide-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

