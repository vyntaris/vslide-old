[package]
name = "vslide-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VSlide egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
vslide-geom = { workspace = true }
vslide-color = { workspace = true }
vslide-model = { workspace = true }
vslide-fonts = { workspace = true }
vslide-text = { workspace = true }
vslide-render = { workspace = true }
vslide-anim = { workspace = true }
vslide-engine = { workspace = true }
vslide-media = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true }
# kittest's own dev-dependencies do not propagate; tests need both font features explicitly.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
