[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/vslide", "apps/vslide-cli"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/deckcraft"

[workspace.dependencies]
# internal
vslide-geom = { path = "crates/geom" }
vslide-color = { path = "crates/color" }
vslide-metafile = { path = "crates/metafile" }
vslide-model = { path = "crates/model" }
vslide-fonts = { path = "crates/fonts" }
vslide-text = { path = "crates/text" }
vslide-render = { path = "crates/render" }
vslide-pdf = { path = "crates/pdf" }
vslide-pptx = { path = "crates/pptx" }
vslide-format = { path = "crates/format" }
vslide-anim = { path = "crates/anim" }
vslide-engine = { path = "crates/engine" }
vslide-mcp = { path = "crates/mcp" }
vslide-ui-egui = { path = "crates/ui-egui" }
vslide-media = { path = "crates/media" }
# codecs (ported from FilmCraft, same owner and licence)
vslide-bitstream = { path = "crates/bitstream" }
vslide-h264 = { path = "crates/h264" }
vslide-hevc = { path = "crates/hevc" }
vslide-vp9 = { path = "crates/vp9" }
vslide-av1 = { path = "crates/av1" }
vslide-isobmff = { path = "crates/isobmff" }
vslide-matroska = { path = "crates/matroska" }
vslide-ogg = { path = "crates/ogg" }
vslide-opus = { path = "crates/opus" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
krilla = { version = "0.8", features = ["pdf"] }
i_overlay = "9"
quick-xml = "0.38"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
